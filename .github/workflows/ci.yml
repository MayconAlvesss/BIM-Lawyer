name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python ${{ matrix.python-version }} · Rule Engine Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the rule engine needs — no OpenAI/LangChain calls in CI
          pip install fastapi uvicorn pydantic pydantic-settings pandas fpdf2 \
                      pytest pytest-cov ruff

      - name: Lint with ruff
        run: |
          ruff check . --fix --exit-zero
          ruff check .

      - name: Run rule engine tests
        # The LLM/RAG layer requires live API keys — we test only the deterministic core.
        # Set SKIP_LLM_TESTS=1 so any future test that imports langchain can be skipped
        # with @pytest.mark.skipif(os.getenv("SKIP_LLM_TESTS"), ...).
        env:
          SKIP_LLM_TESTS: "1"
        run: |
          pytest tests/ -v --tb=short \
            --cov=core \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --ignore=tests/test_llm.py 2>/dev/null || true
          pytest tests/ -v --tb=short \
            --cov=core \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7
